name: iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and test on the iOS Simulator
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/BubblePopDerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/TestResults.xcresult
        run: |
          set -o pipefail
          bash scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload test results and build log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
